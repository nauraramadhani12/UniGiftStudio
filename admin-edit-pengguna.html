<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Pengguna | Uni Gift Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900 flex h-screen overflow-hidden">

    <aside class="w-64 bg-[#161d31] text-slate-300 flex flex-col justify-between shrink-0">
        <div>
            <div class="h-20 flex items-center px-6 gap-3 border-b border-white/5">
                <div class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center text-white font-bold text-lg">U</div>
                <h1 class="text-xl font-bold text-white">Uni Gift <span class="text-orange-500">Admin</span></h1>
            </div>
            <div class="p-4">
                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4 px-2">Menu Utama</p>
                <nav class="space-y-1">
                    <a href="dashboard_admin.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold">
                        <span class="text-xl">📊</span> Dashboard
                    </a>
                    <a href="admin-pesanan.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold">
                        <span class="text-xl">📦</span> Pesanan
                    </a>
                    <a href="admin-custom-ai.html" class="flex items-center justify-between px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold">
                        <div class="flex items-center gap-3"><span class="text-xl">✨</span> Custom AI</div>
                        <span class="bg-orange-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">3 Baru</span>
                    </a>
                    <a href="admin-katalog.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold">
                        <span class="text-xl">🛍️</span> Katalog Produk
                    </a>
                    <a href="admin-pengguna.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-orange-500 text-white font-semibold shadow-lg shadow-orange-500/20">
                        <span class="text-xl">👥</span> Manajemen Pengguna
                    </a>
                </nav>
            </div>
        </div>
        <div class="p-4 border-t border-white/5">
            <a href="login.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold text-slate-400 hover:text-red-400">Keluar</a>
        </div>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0">
            <div class="flex items-center gap-4">
                <a href="admin-pengguna.html" class="text-slate-400 hover:text-orange-500 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </a>
                <h2 class="text-xl font-bold text-slate-800">Edit Profil Pengguna</h2>
            </div>
            <div class="w-10 h-10 bg-orange-100 text-orange-600 font-bold rounded-full flex items-center justify-center border border-orange-200 cursor-pointer">AU</div>
        </header>

        <main class="flex-1 overflow-y-auto p-8 bg-slate-50/50">
            <form onsubmit="event.preventDefault(); simpanPengguna();" class="max-w-4xl mx-auto bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                
                <div class="p-6 md:p-8 border-b border-slate-100 flex items-center gap-6 bg-slate-50/50">
                    <div class="w-20 h-20 bg-orange-100 rounded-full flex items-center justify-center text-2xl font-black text-orange-600 shrink-0 border-4 border-white shadow-sm">
                        NA
                    </div>
                    <div>
                        <h3 class="text-2xl font-extrabold text-slate-800">Naura</h3>
                        <p class="text-sm font-bold text-slate-500 mt-1">naura@example.com</p>
                        <p class="text-xs font-semibold text-slate-400 mt-1">Bergabung sejak: 15 Feb 2026</p>
                    </div>
                </div>

                <div class="p-6 md:p-8 space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        
                        <div class="md:col-span-2">
                            <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Nama Lengkap</label>
                            <input type="text" value="Naura" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-slate-800 transition">
                        </div>

                        <div>
                            <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Alamat Email</label>
                            <input type="email" value="naura@example.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-slate-800 transition">
                        </div>

                        <div>
                            <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Reset Password</label>
                            <input type="password" placeholder="Kosongkan jika tidak ingin diubah" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium text-slate-800 transition placeholder:text-slate-300">
                        </div>

                        <div>
                            <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Peran (Role) Pengguna</label>
                            <select class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-slate-800 transition">
                                <option value="pelanggan" selected>Pelanggan (Customer)</option>
                                <option value="kreator">Kreator 3D</option>
                                <option value="admin">Admin Dashboard</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Status Akun</label>
                            <select class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-slate-800 transition">
                                <option value="aktif" selected>Aktif</option>
                                <option value="diblokir">Diblokir (Suspend)</option>
                            </select>
                        </div>

                    </div>
                </div>

                <div class="p-6 md:p-8 border-t border-slate-100 flex flex-col sm:flex-row justify-end gap-4 bg-slate-50/30">
                    <button type="button" onclick="window.location.href='admin-pengguna.html'" class="px-8 py-3 rounded-xl font-bold text-slate-600 bg-white border border-slate-200 hover:bg-slate-50 hover:text-slate-900 transition">
                        Batal
                    </button>
                    <button type="submit" class="px-8 py-3 rounded-xl font-bold text-white bg-orange-500 hover:bg-orange-600 transition shadow-lg shadow-orange-500/30 flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        Simpan Profil
                    </button>
                </div>
            </form>
        </main>
    </div>

    <script>
        function simpanPengguna() {
            alert("Profil pengguna berhasil diperbarui!");
            window.location.href = "admin-pengguna.html";
        }
    </script>
</body>
</html>
