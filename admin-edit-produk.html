<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Produk | Uni Gift Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900 flex h-screen overflow-hidden">

    <aside class="w-64 bg-[#161d31] text-slate-300 flex flex-col justify-between shrink-0">
        <div>
            <div class="h-20 flex items-center px-6 gap-3 border-b border-white/5">
                <div class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center text-white font-bold text-lg">U</div>
                <h1 class="text-xl font-bold text-white">Uni Gift <span class="text-orange-500">Admin</span></h1>
            </div>
            <div class="p-4">
                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4 px-2">Menu Utama</p>
                <nav class="space-y-1">
                    <a href="dashboard_admin.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold">
                        <span class="text-xl">📊</span> Dashboard
                    </a>
                    <a href="admin-pesanan.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold">
                        <span class="text-xl">📦</span> Pesanan
                    </a>
                    <a href="admin-custom-ai.html" class="flex items-center justify-between px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold">
                        <div class="flex items-center gap-3"><span class="text-xl">✨</span> Custom AI</div>
                        <span class="bg-orange-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">3 Baru</span>
                    </a>
                    <a href="admin-katalog.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-orange-500 text-white font-semibold shadow-lg shadow-orange-500/20">
                        <span class="text-xl">🛍️</span> Katalog Produk
                    </a>
                    <a href="admin-pengguna.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold">
                        <span class="text-xl">👥</span> Manajemen Pengguna
                    </a>
                </nav>
            </div>
        </div>
        <div class="p-4 border-t border-white/5">
            <a href="login.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold text-slate-400 hover:text-red-400">Keluar</a>
        </div>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0">
            <div class="flex items-center gap-4">
                <a href="admin-katalog.html" class="text-slate-400 hover:text-orange-500 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </a>
                <h2 class="text-xl font-bold text-slate-800">Edit Produk</h2>
            </div>
            <div class="w-10 h-10 bg-orange-100 text-orange-600 font-bold rounded-full flex items-center justify-center border border-orange-200 cursor-pointer">AU</div>
        </header>

        <main class="flex-1 overflow-y-auto p-8 bg-slate-50/50">
            <form onsubmit="event.preventDefault(); simpanPerubahan();" class="max-w-5xl mx-auto bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                
                <div class="p-6 md:p-8 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <div>
                        <h3 class="text-lg font-extrabold text-slate-800">Night Ride Glow Tag</h3>
                        <p class="text-sm font-bold text-slate-500 mt-1">ID Produk: #PRD-001</p>
                    </div>
                    <span class="bg-green-100 text-green-600 px-4 py-1.5 rounded-full text-xs font-extrabold uppercase tracking-wide border border-green-200">Status: Aktif</span>
                </div>

                <div class="p-6 md:p-8 grid grid-cols-1 lg:grid-cols-3 gap-10">
                    
                    <div class="lg:col-span-1 space-y-4">
                        <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest">Foto Produk</label>
                        <div class="aspect-square bg-slate-900 rounded-2xl flex flex-col items-center justify-center border-2 border-dashed border-slate-300 hover:border-orange-500 transition cursor-pointer group relative overflow-hidden">
                            <span class="text-7xl group-hover:scale-110 transition-transform duration-300">🏍️</span>
                            <div class="absolute inset-0 bg-slate-900/60 opacity-0 group-hover:opacity-100 transition flex items-center justify-center backdrop-blur-sm">
                                <span class="text-white font-bold text-sm flex items-center gap-2">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                    Ubah Foto
                                </span>
                            </div>
                        </div>
                        <p class="text-xs font-semibold text-slate-400 text-center">Format: JPG, PNG. Maksimal 2MB.</p>
                    </div>

                    <div class="lg:col-span-2 space-y-6">
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="md:col-span-2">
                                <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Nama Produk</label>
                                <input type="text" value="Night Ride Glow Tag" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-slate-800 transition">
                            </div>

                            <div>
                                <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Kategori</label>
                                <select class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-slate-800 transition">
                                    <option value="keychain" selected>Gantungan Kunci (Keychain)</option>
                                    <option value="socks">Kaos Kaki (Socks)</option>
                                    <option value="statue">Pajangan (Statue)</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Status Produk</label>
                                <select class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-slate-800 transition">
                                    <option value="aktif" selected>Aktif (Tersedia)</option>
                                    <option value="habis">Stok Habis</option>
                                    <option value="nonaktif">Sembunyikan</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Harga Jual (Rp)</label>
                                <input type="number" value="45000" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-slate-800 transition">
                            </div>

                            <div>
                                <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Stok Saat Ini</label>
                                <input type="number" value="120" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-slate-800 transition">
                            </div>

                            <div class="md:col-span-2">
                                <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Deskripsi Produk</label>
                                <textarea rows="4" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium text-slate-700 transition resize-none">Gantungan kunci kustom yang dicetak menggunakan teknologi 3D Printing presisi tinggi. Dilengkapi dengan material photoluminescent yang menyerap cahaya di siang hari dan menyala terang (glow in the dark) saat kamu berkendara di malam hari.</textarea>
                            </div>
                        </div>

                    </div>
                </div>

                <div class="p-6 md:p-8 border-t border-slate-100 flex flex-col sm:flex-row justify-end gap-4 bg-slate-50/30">
                    <button type="button" onclick="window.location.href='admin-katalog.html'" class="px-8 py-3 rounded-xl font-bold text-slate-600 bg-white border border-slate-200 hover:bg-slate-50 hover:text-slate-900 transition">
                        Batal
                    </button>
                    <button type="submit" class="px-8 py-3 rounded-xl font-bold text-white bg-orange-500 hover:bg-orange-600 transition shadow-lg shadow-orange-500/30 flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        Simpan Perubahan
                    </button>
                </div>
            </form>
        </main>
    </div>

    <script>
        function simpanPerubahan() {
            alert("Data produk berhasil diperbarui!");
            window.location.href = "admin-katalog.html";
        }
    </script>
</body>
</html>
